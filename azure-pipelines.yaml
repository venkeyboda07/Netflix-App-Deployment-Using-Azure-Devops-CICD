pool:
  vmImage: 'ubuntu-latest'

trigger:
  branches:
    include:
      - main
      - feature_develop
  paths:
    include:
      - src/*
      - Dockerfile
      - package.json

variables:
  dockerimagerepo: 'venkeyboda/netflix'
  dockerImagetag: 'latest'

stages:

# ========================= CI STAGE =========================

- stage: CI
  displayName: "Build & Push Docker Image"
  jobs:
    - job: build
      displayName: 'Building and testing'

      steps:
        - task: Docker@2
          displayName: 'Build docker image'  
          inputs:
            command: 'build'
            Dockerfile: 'Dockerfile'
            repository: $(dockerimagerepo)
            tags: |
              $(dockerImagetag)
            arguments: |
              --build-arg TMDB_V3_API_KEY=$(TMDB_V3_API_KEY)

        - task: Bash@3
          displayName: 'Trivy Scan'
          inputs:
            filePath: 'Scripts/trivy-scan.sh'
            arguments: '$(dockerimagerepo):$(dockerImagetag)'
            
        - task: Docker@2
          displayName: 'Push docker image'
          inputs:
            command: 'push'
            containerRegistry: 'DOCKER_HUB'
            repository: $(dockerimagerepo)
            tags: |
              $(dockerImagetag)

        - task: PublishBuildArtifacts@1
          displayName: 'Upload Trivy Report'
          inputs:
            PathtoPublish: 'trivy-reports'
            ArtifactName: 'Trivy-Report'
            publishLocation: 'Container'
            